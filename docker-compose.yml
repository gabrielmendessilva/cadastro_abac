services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ged_app
    restart: unless-stopped
    volumes:
      - .env:/var/www/.env
      # Código-fonte montado do host: alterar .php/.blade.php e dar
      # `docker compose restart app` já publica, sem rebuildar a imagem.
      # De fora ficam vendor/, bootstrap/cache e public/build de propósito —
      # o vendor da imagem é --no-dev e o do host tem as dependências de teste.
      # Mexeu em composer.json ou em resources/js|css? Aí é ./deploy.sh mesmo.
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./lang:/var/www/lang
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - storage_data:/var/www/storage
    networks:
      - ged_network

  nginx:
    image: nginx:1.25-alpine
    container_name: ged_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/public
      - storage_data:/var/www/storage
    depends_on:
      - app
    networks:
      - ged_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ged.rule=Host(`ged.abac-admin.cloud`)"
      - "traefik.http.routers.ged.entrypoints=websecure"
      - "traefik.http.routers.ged.tls.certresolver=letsencrypt"
      - "traefik.http.services.ged.loadbalancer.server.port=80"

volumes:
  storage_data:

networks:
  ged_network:
    driver: bridge